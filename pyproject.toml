[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cornetto"
version = "1.0.0"
description = "Cornetto: a benchmark for LLM-driven network configuration repair"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.71.0",
    "google-genai>=1.15.0",
    "huggingface-hub>=0.29.0",
    "hydra-core==1.3.2",
    "langchain>=1.0.5",
    "langchain-classic>=1.0.0",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.0.2",
    "mistralai>=1.9.0",
    "ollama>=0.4.7",
    "openai>=2.8.0",
    "paramiko>=3.0.0",
    "pybatfish>=2025.7.7.2423",
    "python-dotenv>=0.9.0",
    "tiktoken>=0.12.0",
]

[project.scripts]
cornetto = "src.benchmark.zero_shot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
